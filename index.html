<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tempo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233B82F6'%3E%3Cpath fill-rule='evenodd' d='M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z' clip-rule='evenodd'/%3E%3C/svg%3E" />
    <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root { --transition-speed: 0.4s; }
      
      /* --- LIGHT MODE (Pure White) --- */
      :root {
        --brand-primary: #2563EB; 
        --brand-secondary: #3B82F6;
        --brand-background: #FFFFFF; 
        --brand-surface-rgb: 245, 245, 245; /* Slightly darker surface for contrast */
        --brand-text-primary: #0F172A;
        --brand-text-secondary: #475569;
        --brand-accent: #06B6D4;
        --brand-accent-rgb: 6, 182, 212;
        --brand-gray-800: #E2E8F0;
        --brand-gray-700: #CBD5E1;
        --glass-opacity: 0.95; 
        --bg-gradient: #FFFFFF;
        --shadow-color: 0, 0, 0;
      }

      /* --- NEON (Restored) --- */
      html.neon {
        --brand-primary: #ccff00; 
        --brand-secondary: #39ff14; 
        --brand-background: #000000; 
        --brand-surface-rgb: 20, 20, 20; 
        --brand-text-primary: #ccff00; 
        --brand-text-secondary: #a3cf00;
        --brand-accent: #ffffff;
        --brand-accent-rgb: 255, 255, 255;
        --brand-gray-800: #1a1a1a;
        --brand-gray-700: #333333;
        --glass-opacity: 0.9;
        --bg-gradient: radial-gradient(circle at center, #111111 0%, #000000 100%);
        --shadow-color: 204, 255, 0;
      }

      /* --- DARK MODE --- */
      html.dark {
        --brand-primary: #3B82F6;
        --brand-secondary: #60A5FA;
        --brand-background: #020617;
        --brand-surface-rgb: 30, 41, 59;
        --brand-text-primary: #F8FAFC;
        --brand-text-secondary: #94A3B8;
        --brand-accent: #38BDF8;
        --brand-accent-rgb: 56, 189, 248;
        --brand-gray-800: #1E293B;
        --brand-gray-700: #334155;
        --glass-opacity: 0.75;
        --bg-gradient: linear-gradient(to bottom, #020617, #0f172a);
      }

      /* --- MIDNIGHT --- */
      html.midnight {
        --brand-primary: #8B5CF6;
        --brand-secondary: #A78BFA;
        --brand-surface-rgb: 30, 27, 75; 
        --brand-text-primary: #E0E7FF;
        --brand-text-secondary: #A5B4FC;
        --brand-accent: #F472B6;
        --brand-accent-rgb: 244, 114, 182;
        --brand-gray-800: #312E81;
        --brand-gray-700: #4338CA;
        --glass-opacity: 0.65;
        --bg-gradient: radial-gradient(circle at top right, #2e1065, #172554);
      }

       /* --- SUNSET --- */
       html.sunset {
        --brand-primary: #F43F5E; 
        --brand-secondary: #FB923C;
        --brand-surface-rgb: 60, 20, 40;
        --brand-text-primary: #FFF1F2;
        --brand-text-secondary: #FDA4AF;
        --brand-accent: #FBBF24;
        --brand-accent-rgb: 251, 191, 36;
        --brand-gray-800: #881337;
        --brand-gray-700: #9F1239;
        --glass-opacity: 0.7;
        --bg-gradient: linear-gradient(135deg, #4c0519 0%, #7c2d12 50%, #be123c 100%);
      }

      body {
        background: var(--custom-bg, var(--bg-gradient));
        background-attachment: fixed;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        color: var(--brand-text-primary);
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.5s ease, color 0.3s ease;
      }

      /* GLOBAL INPUT FIX: Ensures text contrast */
      input, textarea, select {
        color: var(--brand-text-primary) !important;
        background-color: rgba(var(--brand-surface-rgb), 0.5) !important; /* Semi-transparent matching surface */
        border-color: var(--brand-gray-700) !important;
      }
      input::placeholder, textarea::placeholder {
        color: var(--brand-text-secondary) !important;
        opacity: 0.7;
      }

      .glass-panel {
        background: rgba(var(--brand-surface-rgb), var(--glass-opacity));
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(var(--brand-gray-700), 0.3);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
      }

      .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--brand-gray-700); border-radius: 10px; }

      .btn-floating-action {
        background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
        color: white;
        box-shadow: 0 4px 15px rgba(var(--brand-accent-rgb), 0.4);
        border: 1px solid rgba(255,255,255,0.2);
        transition: transform 0.2s, box-shadow 0.2s;
      }
      /* Neon Theme Button Fix */
      html.neon .btn-floating-action { color: black; box-shadow: 0 0 20px var(--brand-primary); } 
      
      .btn-floating-action:active { transform: scale(0.92); }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
