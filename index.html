<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tempo</title>

    <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        /* Light Theme (Improved Contrast) */
        --brand-primary: #2563EB; /* Darker Blue */
        --brand-secondary: #3B82F6;
        --brand-background: #F3F4F6; /* Light Gray Background */
        --brand-surface-rgb: 255, 255, 255; /* Pure White Surface */
        --brand-text-primary: #111827; /* Near Black */
        --brand-text-secondary: #4B5563; /* Dark Gray */
        --brand-accent: #0891B2;
        --brand-accent-rgb: 8, 145, 178;
        --brand-gray-900: #F9FAFB;
        --brand-gray-800: #E5E7EB; /* Borders */
        --brand-gray-700: #D1D5DB;
        --brand-gray-600: #9CA3AF;
      }
      html.dark {
        /* Dark Theme (Total Black) */
        --brand-primary: #1976D2;
        --brand-secondary: #64B5F6;
        --brand-background: #0D1117;
        --brand-surface-rgb: 22, 27, 34; /* For RGBA - #161B22 */
        --brand-text-primary: #E0E0E0;
        --brand-text-secondary: #B0B0B0;
        --brand-accent: #89DDF3;
        --brand-accent-rgb: 137, 221, 243;
        --brand-gray-900: #121212;
        --brand-gray-800: #2C2C2C;
        --brand-gray-700: #3C3C3C;
        --brand-gray-600: #5C5C5C;
      }
      html.midnight {
        /* Midnight Blue Theme */
        --brand-primary: #38bdf8; /* Sky Blue */
        --brand-secondary: #6366f1;
        --brand-background: #0f172a;
        --brand-surface-rgb: 30, 41, 59; /* For RGBA - #1e293b */
        --brand-text-primary: #f1f5f9;
        --brand-text-secondary: #94a3b8;
        --brand-accent: #c084fc; /* Purple - Distinct from Primary */
        --brand-accent-rgb: 192, 132, 252;
        --brand-gray-900: #020617;
        --brand-gray-800: #1e293b;
        --brand-gray-700: #334155;
        --brand-gray-600: #475569;
      }
       html.forest {
        /* New Forest Theme */
        --brand-primary: #22c55e; /* Green */
        --brand-secondary: #84cc16;
        --brand-background: #1c1917;
        --brand-surface-rgb: 41, 37, 36; /* For RGBA - #292524 */
        --brand-text-primary: #f5f5f4;
        --brand-text-secondary: #a8a29e;
        --brand-accent: #facc15; /* Yellow/Gold - Distinct from Primary */
        --brand-accent-rgb: 250, 204, 21;
        --brand-gray-900: #0c0a09;
        --brand-gray-800: #292524;
        --brand-gray-700: #44403c;
        --brand-gray-600: #57534e;
      }
      body {
        background-color: var(--brand-background);
        transition: background-color 0.3s ease;
      }
      
      /* Text Shadow for readability on images */
      .text-shadow-sm {
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      }
      
      /* Explicit Keyframes for Custom CSS Classes */
      @keyframes slideUpFadeIn {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes slideDownFadeOut {
        0% { opacity: 1; transform: translateY(0); height: auto; margin-bottom: 0.5rem; padding-top: 0.5rem; padding-bottom: 0.5rem; }
        100% { opacity: 0; transform: translateY(10px); height: 0px; margin: 0; padding: 0; overflow: hidden; }
      }
      @keyframes slideInRight {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }

      .task-item {
        opacity: 0;
        transform: translateY(20px);
        animation: slideUpFadeIn 0.4s ease-out forwards;
      }
      .task-item-exit {
        animation: slideDownFadeOut 0.3s ease-in forwards;
      }
      
      .list-item-enter {
        animation: slideInRight 0.3s ease-out forwards;
      }
      .list-item-exit {
        animation: slideDownFadeOut 0.3s ease-in forwards;
      }

      /* Utilities */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }

      /* UIverse: Loud Chicken 53 (Button) */
      .btn-loud-chicken {
        background: linear-gradient(to bottom right, var(--brand-primary), var(--brand-secondary));
        border: 0;
        border-radius: 12px;
        color: #FFFFFF;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        font-size: 16px;
        font-weight: 500;
        line-height: 2.5;
        outline: transparent;
        text-align: center;
        text-decoration: none;
        transition: box-shadow .2s,-webkit-transform .1s,transform .1s;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        white-space: nowrap;
        box-shadow: 0 0 0 3px rgba(var(--brand-surface-rgb), 0.1), 0 4px 15px rgba(0,0,0,0.3);
      }

      .btn-loud-chicken:not(:disabled):hover {
        box-shadow: 0 0 0 2px rgba(var(--brand-surface-rgb), 0.1), 0 6px 20px rgba(0,0,0,0.4);
        transform: translateY(-1px);
      }

      .btn-loud-chicken:not(:disabled):active {
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        transform: translateY(2px);
      }
      
      .btn-loud-chicken:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        background: var(--brand-gray-600);
      }

      /* UIverse: Fast Octopus 78 (Developer Card) */
      .card-fast-octopus {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      
      .card-fast-octopus:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(var(--brand-accent-rgb), 0.2);
        border: 1px solid var(--brand-accent);
      }

      /* UIverse: Plastic Moth 91 (Radio/Priority Picker) */
      .radio-plastic-moth-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      
      .radio-plastic-moth-input {
        display: none;
      }
      
      .radio-plastic-moth-label {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        color: var(--brand-text-secondary);
        background-color: rgba(var(--brand-surface-rgb), 0.1);
        border: 2px solid transparent;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      
      .radio-plastic-moth-input:checked + .radio-plastic-moth-label {
        background-color: rgba(var(--brand-surface-rgb), 0.2);
        color: white;
        border-color: var(--brand-primary);
        box-shadow: 0 0 10px rgba(var(--brand-accent-rgb), 0.3);
      }
      
      /* Specific Colors for Priorities */
      .radio-plastic-moth-input[value="high"]:checked + .radio-plastic-moth-label {
        border-color: #ef4444;
        color: #ef4444;
      }
      .radio-plastic-moth-input[value="medium"]:checked + .radio-plastic-moth-label {
        border-color: #f97316;
        color: #f97316;
      }
      .radio-plastic-moth-input[value="low"]:checked + .radio-plastic-moth-label {
        border-color: #3b82f6;
        color: #3b82f6;
      }
      
      /* UIverse: Heavy Dog 14 (Theme Switcher Button) adapted */
      .theme-btn {
        position: relative;
        padding: 12px 24px;
        background: transparent;
        border: 2px solid var(--brand-gray-700);
        border-radius: 12px;
        color: var(--brand-text-secondary);
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
        overflow: hidden;
      }
      
      .theme-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        margin: auto;
        width: 50px;
        height: 50px;
        border-radius: 50px;
        scale: 0;
        z-index: -1;
        background-color: var(--brand-primary);
        transition: all 0.6s cubic-bezier(0.23, 1, 0.320, 1);
      }
      
      .theme-btn:hover::before {
        scale: 3;
      }
      
      .theme-btn:hover {
        color: white;
        border-color: var(--brand-primary);
      }
      
      .theme-btn.active {
        background-color: var(--brand-primary);
        border-color: var(--brand-primary);
        color: white;
        box-shadow: 0 0 20px rgba(var(--brand-accent-rgb), 0.4);
      }
      
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'brand-primary': 'var(--brand-primary)',
              'brand-secondary': 'var(--brand-secondary)',
              'brand-background': 'var(--brand-background)',
              'brand-surface': 'rgba(var(--brand-surface-rgb), 0.2)', /* Increased Transparency */
              'brand-text-primary': 'var(--brand-text-primary)',
              'brand-text-secondary': 'var(--brand-text-secondary)',
              'brand-accent': 'var(--brand-accent)',
              'gray-900': 'var(--brand-gray-900)',
              'brand-surface-solid': 'rgb(var(--brand-surface-rgb))',
              'brand-gray-800': 'var(--brand-gray-800)',
              'brand-gray-700': 'var(--brand-gray-700)',
              'brand-gray-600': 'var(--brand-gray-600)',
            },
            boxShadow: {
              'glow-primary': '0 0 15px 0 rgba(var(--brand-accent-rgb), 0.45)',
            },
            animation: {
                'fade-in': 'fadeIn 0.3s ease-in-out',
                'scale-in': 'scaleIn 0.2s ease-out',
            },
            keyframes: {
                fadeIn: {
                    '0%': { opacity: 0 },
                    '100%': { opacity: 1 },
                },
                scaleIn: {
                    '0%': { opacity: 0, transform: 'scale(0.95)' },
                    '100%': { opacity: 1, transform: 'scale(1)' },
                },
                slideUpFadeIn: {
                  '0%': { opacity: 0, transform: 'translateY(20px)' },
                  '100%': { opacity: 1, transform: 'translateY(0)' },
                },
                slideDownFadeOut: {
                  '0%': { opacity: 1, transform: 'translateY(0)', height: 'auto', margin: '0.75rem 0', padding: '0.75rem' },
                  '100%': { opacity: 0, transform: 'translateY(20px)', height: '0px', margin: '0', padding: '0' },
                }
            },
          },
        },
      }
    </script>

}
</script>
