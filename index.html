<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tempo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234F46E5'%3E%3Cpath fill-rule='evenodd' d='M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z' clip-rule='evenodd'/%3E%3C/svg%3E" />
    <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
    
    <meta name="theme-color" content="#F1F5F9" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                primary: 'var(--brand-primary)',
                secondary: 'var(--brand-secondary)',
                background: 'var(--brand-background)',
                surface: 'rgb(var(--brand-surface-rgb))', 
                'surface-solid': 'var(--brand-surface-solid)',
                'text-primary': 'var(--brand-text-primary)',
                'text-secondary': 'var(--brand-text-secondary)',
                accent: 'var(--brand-accent)',
                'gray-800': 'var(--brand-gray-800)',
                'gray-700': 'var(--brand-gray-700)',
                'chip-bg': 'var(--brand-chip-bg)',
              }
            },
            boxShadow: {
              glow: 'var(--shadow-glow)',
            }
          }
        }
      }
    </script>

    <style>
      :root { --transition-speed: 0.4s; }
      
      /* ========================================= */
      /* 1. PRO LIGHT                              */
      /* ========================================= */
      :root {
        --brand-primary: #4F46E5; 
        --brand-secondary: #818CF8;
        --brand-background: #F1F5F9; 
        --brand-surface-rgb: 255, 255, 255;
        --brand-surface-solid: #FFFFFF;
        --brand-text-primary: #0F172A; 
        --brand-text-secondary: #64748B; 
        --brand-accent: #0284C7; 
        --brand-accent-rgb: 2, 132, 199;
        
        --brand-gray-800: #E2E8F0; 
        --brand-gray-700: #CBD5E1; 
        
        --glass-opacity: 0.85; 
        --glass-border-opacity: 1.0; 
        
        --bg-gradient: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%); 
        --brand-text-on-primary: #FFFFFF;
        --brand-chip-bg: #E2E8F0; 
        
        --shadow-glow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
        --icon-filter: none;
        text-shadow: none !important;
        --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      }

      /* ========================================= */
      /* 2. FOREST (Fully Synced with Android)     */
      /* ========================================= */
      html.forest {
        --brand-primary: #10B981; /* Emerald 500 */
        --brand-secondary: #34D399; 
        --brand-background: #022C22; /* Deep Emerald 950 */
        --brand-surface-rgb: 6, 78, 59; /* Emerald 900 base */
        --brand-surface-solid: #064E3B; /* Emerald 900 solid */
        --brand-text-primary: #ECFDF5; /* Emerald 50 */
        --brand-text-secondary: #6EE7B7; /* Emerald 300 */
        --brand-accent: #059669; /* Emerald 600 */
        --brand-accent-rgb: 5, 150, 105;
        
        --brand-gray-800: #065F46; /* Emerald 800 */
        --brand-gray-700: #047857; /* Emerald 700 */
        
        --glass-opacity: 0.85;
        --glass-border-opacity: 0.2;
        --bg-gradient: radial-gradient(at 50% 0%, #065F46 0%, #022C22 80%);
        --brand-text-on-primary: #FFFFFF;
        --brand-chip-bg: #065F46;
        
        --shadow-glow: 0 0 20px rgba(16, 185, 129, 0.25);
        --icon-filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.3));
        --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      /* --- 3. NEON --- */
      html.neon {
        --brand-primary: #ccff00; 
        --brand-secondary: #39ff14; 
        --brand-background: #000000; 
        --brand-surface-rgb: 18, 18, 18;
        --brand-surface-solid: #121212; 
        --brand-text-primary: #ccff00; 
        --brand-text-secondary: #a3cf00;
        --brand-accent: #ffffff;
        --brand-accent-rgb: 255, 255, 255;
        --brand-gray-800: #333333;
        --brand-gray-700: #444444;
        --glass-opacity: 0.9;
        --glass-border-opacity: 0.5;
        --bg-gradient: radial-gradient(circle at center, #111111 0%, #000000 100%);
        --brand-text-on-primary: #000000; 
        --brand-chip-bg: #333333;
        --shadow-glow: 0 0 10px var(--brand-primary);
        --icon-filter: drop-shadow(0 0 2px rgba(204, 255, 0, 0.5));
        --card-shadow: 0 4px 30px 0 rgba(204, 255, 0, 0.15);
      }

      /* --- 4. DEEP DARK --- */
      html.dark {
        --brand-primary: #3B82F6; 
        --brand-secondary: #60A5FA;
        --brand-background: #020617;
        --brand-surface-rgb: 30, 41, 59;
        --brand-surface-solid: #1E293B;
        --brand-text-primary: #F8FAFC;
        --brand-text-secondary: #94A3B8;
        --brand-accent: #38BDF8;
        --brand-accent-rgb: 56, 189, 248;
        --brand-gray-800: #334155;
        --brand-gray-700: #475569;
        --glass-opacity: 0.8;
        --glass-border-opacity: 0.5;
        --bg-gradient: linear-gradient(to bottom, #020617, #0f172a);
        --brand-text-on-primary: #FFFFFF;
        --brand-chip-bg: #1E293B;
        --shadow-glow: 0 0 15px rgba(59, 130, 246, 0.3);
        --icon-filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.4));
        --card-shadow: 0 4px 30px 0 rgba(0, 0, 0, 0.3);
      }

      /* --- 5. MIDNIGHT --- */
      html.midnight {
        --brand-primary: #8B5CF6;
        --brand-secondary: #A78BFA;
        --brand-surface-rgb: 49, 46, 129;
        --brand-surface-solid: #312E81;
        --brand-text-primary: #E0E7FF;
        --brand-text-secondary: #A5B4FC;
        --brand-accent: #F472B6;
        --brand-accent-rgb: 244, 114, 182;
        --brand-gray-800: #4338CA;
        --brand-gray-700: #6366F1;
        --glass-opacity: 0.7;
        --glass-border-opacity: 0.5;
        --bg-gradient: radial-gradient(circle at top right, #2e1065, #172554);
        --brand-text-on-primary: #FFFFFF;
        --brand-chip-bg: #312E81;
        --shadow-glow: 0 0 15px rgba(139, 92, 246, 0.3);
        --icon-filter: drop-shadow(0 0 5px rgba(139, 92, 246, 0.4));
        --card-shadow: 0 4px 30px 0 rgba(0, 0, 0, 0.3);
      }

      body {
        background: var(--custom-bg, var(--bg-gradient));
        background-attachment: fixed;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        color: var(--brand-text-primary);
        min-height: 100vh;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.5s ease, color 0.3s ease;
        text-shadow: none !important;
      }

      svg { filter: var(--icon-filter); transition: filter 0.3s; }

      input, textarea, select {
        color: var(--brand-text-primary) !important;
        background-color: rgba(var(--brand-surface-rgb), 0.7) !important;
        border: 1px solid var(--brand-gray-700) !important;
      }
      input::placeholder, textarea::placeholder {
        color: var(--brand-text-secondary) !important;
        opacity: 0.7;
      }

      .glass-panel {
        /* Fallback background if --main-panel-bg is not set */
        background: var(--main-panel-bg, rgba(var(--brand-surface-rgb), var(--glass-opacity)));
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(var(--brand-gray-700), var(--glass-border-opacity));
        box-shadow: var(--card-shadow);
      }
      
      /* Modals remain opaque */
      .modal-surface {
          background: rgba(var(--brand-surface-rgb), 1.0) !important;
          border-color: var(--brand-gray-700) !important;
      }

      .shadow-glow { box-shadow: var(--shadow-glow); }
      .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--brand-gray-700); border-radius: 10px; }

      .btn-floating-action {
        background: var(--brand-primary);
        color: var(--brand-text-on-primary);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255,255,255,0.1);
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .btn-floating-action:active { transform: scale(0.92); }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
