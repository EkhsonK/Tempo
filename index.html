<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tempo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233B82F6'%3E%3Cpath fill-rule='evenodd' d='M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z' clip-rule='evenodd'/%3E%3C/svg%3E" />
    <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root { --transition-speed: 0.5s; }
      
      /* --- LIGHT MODE --- */
      :root {
        --brand-primary: #2563EB; 
        --brand-secondary: #3B82F6;
        --brand-background: #FFFFFF; 
        --brand-surface-rgb: 255, 255, 255;
        --brand-text-primary: #0F172A;
        --brand-text-secondary: #64748B;
        --brand-accent: #06B6D4;
        --brand-accent-rgb: 6, 182, 212;
        --brand-gray-800: #E2E8F0;
        --brand-gray-700: #CBD5E1;
        --glass-opacity: 0.95; 
        --bg-gradient: #FFFFFF;
        --shadow-color: 0, 0, 0;
      }

      /* --- MINT --- */
      html.mint {
        --brand-primary: #059669;
        --brand-secondary: #10B981;
        --brand-background: #ecfdf5;
        --brand-surface-rgb: 255, 255, 255;
        --brand-text-primary: #064e3b;
        --brand-text-secondary: #047857;
        --brand-accent: #0d9488;
        --brand-accent-rgb: 13, 148, 136;
        --brand-gray-800: #d1fae5;
        --brand-gray-700: #a7f3d0;
        --glass-opacity: 0.85;
        --bg-gradient: linear-gradient(to bottom right, #ecfdf5, #f0fdfa);
        --shadow-color: 5, 150, 105;
      }

      /* --- DARK MODE --- */
      html.dark {
        --brand-primary: #3B82F6;
        --brand-secondary: #60A5FA;
        --brand-background: #020617;
        --brand-surface-rgb: 15, 23, 42;
        --brand-text-primary: #F8FAFC;
        --brand-text-secondary: #94A3B8;
        --brand-accent: #38BDF8;
        --brand-accent-rgb: 56, 189, 248;
        --brand-gray-800: #1E293B;
        --brand-gray-700: #334155;
        --glass-opacity: 0.6;
        --bg-gradient: linear-gradient(to bottom, #020617, #0f172a);
      }

      /* --- MIDNIGHT --- */
      html.midnight {
        --brand-primary: #8B5CF6;
        --brand-secondary: #A78BFA;
        --brand-surface-rgb: 30, 27, 75; 
        --brand-text-primary: #E0E7FF;
        --brand-text-secondary: #A5B4FC;
        --brand-accent: #F472B6;
        --brand-accent-rgb: 244, 114, 182;
        --brand-gray-800: #312E81;
        --brand-gray-700: #4338CA;
        --glass-opacity: 0.5;
        --bg-gradient: radial-gradient(circle at top right, #2e1065, #172554);
      }

       /* --- SUNSET --- */
       html.sunset {
        --brand-primary: #F43F5E; 
        --brand-secondary: #FB923C;
        --brand-surface-rgb: 60, 20, 40;
        --brand-text-primary: #FFF1F2;
        --brand-text-secondary: #FDA4AF;
        --brand-accent: #FBBF24;
        --brand-accent-rgb: 251, 191, 36;
        --brand-gray-800: #881337;
        --brand-gray-700: #9F1239;
        --glass-opacity: 0.6;
        --bg-gradient: linear-gradient(135deg, #4c0519 0%, #7c2d12 50%, #be123c 100%);
      }

      body {
        background: var(--custom-bg, var(--bg-gradient));
        background-attachment: fixed;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        color: var(--brand-text-primary);
        min-height: 100vh;
        transition: background 0.5s ease, color 0.3s ease;
      }

      .glass-panel {
        background: rgba(var(--brand-surface-rgb), var(--glass-opacity));
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(var(--brand-gray-700), 0.3);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
      }

      .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
      
      .custom-scrollbar::-webkit-scrollbar { width: 5px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--brand-gray-700); border-radius: 10px; }
      .no-scrollbar::-webkit-scrollbar { display: none; }

      .btn-floating-action {
        background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
        color: white;
        box-shadow: 0 8px 20px -5px rgba(var(--brand-accent-rgb), 0.5);
        border: 1px solid rgba(255,255,255,0.3);
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .btn-floating-action:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 12px 30px -5px rgba(var(--brand-accent-rgb), 0.7); }
      .btn-floating-action:active { transform: scale(0.95); }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'brand-primary': 'var(--brand-primary)',
              'brand-secondary': 'var(--brand-secondary)',
              'brand-background': 'transparent', 
              'brand-surface': 'rgba(var(--brand-surface-rgb), var(--glass-opacity))',
              'brand-text-primary': 'var(--brand-text-primary)',
              'brand-text-secondary': 'var(--brand-text-secondary)',
              'brand-accent': 'var(--brand-accent)',
              'brand-gray-800': 'var(--brand-gray-800)',
              'brand-gray-700': 'var(--brand-gray-700)',
            },
            boxShadow: { 'glow': '0 0 20px -5px rgba(var(--brand-accent-rgb), 0.4)', }
          },
        },
      }
    </script>
